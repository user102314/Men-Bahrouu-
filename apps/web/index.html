<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Men Bahrouu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700&family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Inter:wght@400;560;650&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        if (localStorage.getItem("resto.theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
        if (localStorage.getItem("resto.lang") === "ar") {
          document.documentElement.lang = "ar";
          document.documentElement.dir = "rtl";
        }
      } catch {
        /* storage unavailable */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
